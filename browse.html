<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="استكشف الآن أفضل الصور والفيديوهات الخاصة بأنمي جوجوتسو كايسن الحصرية، وشاهد آخر الأخبار ومواعيد إصدار الحلقات من Vault of Curses.">
  <meta name="keywords" content="Vault of Curses, JJK, Anime jujutsu kaisen, Gojo satoru, Sukuna, images jujutsu kaisen, News anime, انمي جوجيتسو كايسن, غوجو ساتورو, صور غوجو ساتورو, صور جوجيتسو كايسن">
  <meta name="author" content="Debeka Yassin Obaida">
  <title>Browse || Vault of Curses</title>

  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" type="image/png" href="/img/favicon.png">
</head>
<body>
  <div class="top-line"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="news" data-i18n="tab-news">News</button>
    <button class="tab-btn" data-tab="pictures" data-i18n="tab-pictures">Pictures</button>
    <button class="tab-btn" data-tab="videos" data-i18n="tab-videos">Videos</button>
  </div>

  <!-- فلتر الأخبار — يظهر فقط في News -->
  <div id="news-filter" class="news-filter">
    <div class="filter-scroll-row">
      <button class="news-btn active" data-news="all"      data-i18n="nf-all">All</button>
      <button class="news-btn" data-news="schedule"        data-i18n="nf-schedule">Episode Schedule</button>
      <button class="news-btn" data-news="author"          data-i18n="nf-author">Author Statements</button>
      <button class="news-btn" data-news="fans"            data-i18n="nf-fans">Fan Opinions</button>
      <button class="news-btn" data-news="important"       data-i18n="nf-important">Important</button>
    </div>
  </div>

  <!-- فلتر الشخصيات — يظهر فقط في Pictures & Videos -->
  <div id="char-filter" class="char-filter" style="display:none;">
    <div class="filter-scroll-row">
      <button class="char-btn active" data-char="all"    data-i18n="cf-all">All</button>
      <button class="char-btn" data-char="gojo"          data-i18n="cf-gojo">Gojo</button>
      <button class="char-btn" data-char="sukuna"        data-i18n="cf-sukuna">Sukuna</button>
      <button class="char-btn" data-char="toji"          data-i18n="cf-toji">Toji</button>
      <button class="char-btn" data-char="megumi"        data-i18n="cf-megumi">Megumi</button>
      <button class="char-btn" data-char="yoji"          data-i18n="cf-yoji">Yoji</button>
      <button class="char-btn" data-char="suguru"        data-i18n="cf-suguru">Suguru</button>
      <button class="char-btn" data-char="shosso"        data-i18n="cf-shosso">Shosso</button>
      <button class="char-btn" data-char="yuta"          data-i18n="cf-yuta">Yuta</button>
    </div>
  </div>

  <div id="content-grid" class="grid"></div>

  <footer>
 <nav>
        <ul>
          <p><a href="index.html" data-i18n="nav-home">Home</a></p>
          <p><a href="about.html" data-i18n="nav-about">About</a></p>
          <p><a href="services.html" data-i18n="nav-dmca">DMCA & Contact</a></p>
        </ul>
      </nav>
    <p data-i18n="footer-text">Vault of Curses, Copyright &copy; 2026</p>
  </footer>

  <button class="back-btn">⬆️</button>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="lang.js"></script>
  <script src="script.js"></script>
  <script>
    var backBtn = document.querySelector(".back-btn");
    window.addEventListener("scroll", function() {
      if (this.pageYOffset > 100) backBtn.classList.add("active");
      else backBtn.classList.remove("active");
    });
    backBtn.addEventListener("click", function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
