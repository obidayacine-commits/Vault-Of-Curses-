<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="استكشف الآن أفضل الصور والفيديوهات الخاصة بأنمي جوجوتسو كايسن الحصرية، وشاهد آخر الأخبار ومواعيد إصدار الحلقات من Vault of Curses.">
  <meta name="keywords" content="Jujutsu kaisen, JJK, Anime jujutsu kaisen, Vault of curses, Gojo satoru, Sukuna, images jujutsu kaisen, News anime, انمي جوجيتسو كايسن, غوجو ساتورو, صور غوجو ساتورو, صور جوجيتسو كايسن">
  <meta name="author" content="Debeka Yassin Obaida">
  <title>Browse || Vault of Curses</title>

  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" type="image/png" href="/img/favicon.png">
</head>
<body>
  <div class="top-line"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="news">News</button>
    <button class="tab-btn" data-tab="pictures">Pictures</button>
    <button class="tab-btn" data-tab="videos">Videos</button>
  </div>

  <!-- فلتر الأخبار — يظهر فقط في News -->
  <div id="news-filter" class="news-filter">
    <div class="filter-scroll-row">
      <button class="news-btn active" data-news="all">الكل</button>
      <button class="news-btn" data-news="schedule">جدول الحلقات</button>
      <button class="news-btn" data-news="author">تصريحات المؤلف</button>
      <button class="news-btn" data-news="fans">آراء المعجبين</button>
      <button class="news-btn" data-news="important">مهم</button>
    </div>
  </div>

  <!-- صندوق البحث — يظهر فقط في Pictures & Videos -->
  <div id="search-box" class="search-box" style="display:none;">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" class="search-input" placeholder="بحث...">
    <button id="search-clear" class="search-clear" style="display:none;" title="مسح">✕</button>
  </div>

  <div id="content-grid" class="grid"></div>

  <div id="card-modal" class="card-modal">
    <div class="card-modal-inner">
      <button class="card-modal-close" id="card-modal-close">✕</button>
      <div id="card-modal-content"></div>
    </div>
  </div>

  <footer>
 <nav>
        <ul>
          <p><a href="index.html">الرئيسية</a></p>
          <p><a href="about.html">من نحن</a></p>
          <p><a href="services.html">حقوق النشر & تواصل معنا</a></p>
        </ul>
      </nav>
    <p>Vault of Curses, Copyright &copy; 2026</p>
  </footer>

  <button class="back-btn">⬆️</button>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
  <script>
    var backBtn = document.querySelector(".back-btn");
    window.addEventListener("scroll", function() {
      if (this.pageYOffset > 100) backBtn.classList.add("active");
      else backBtn.classList.remove("active");
    });
    backBtn.addEventListener("click", function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
